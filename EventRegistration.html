<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SIT Event Registration</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #0078d7, #00b4db);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.form-container{
    width:100%;
    max-width:450px;
    background:white;
    padding:30px;
    border-radius:15px;
    box-shadow:0 0 20px rgba(0,0,0,0.2);
}

h1{
    text-align:center;
    margin-bottom:20px;
    color:#0078d7;
}

label{
    display:block;
    margin-top:12px;
    margin-bottom:5px;
    font-weight:bold;
    color:#333;
}

input,
select,
textarea{
    width:100%;
    padding:10px;
    border:1px solid #ccc;
    border-radius:5px;
    font-size:15px;
}

input:focus,
select:focus,
textarea:focus{
    outline:none;
    border-color:#0078d7;
}

button{
    width:100%;
    padding:12px;
    margin-top:20px;
    background:#0078d7;
    color:white;
    border:none;
    border-radius:5px;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    background:#005bb5;
}

.success-message{
    text-align:center;
    color:green;
    margin-top:15px;
    font-weight:bold;
}
</style>

</head>
<body>

<div class="form-container">

    <h1>SIT Event Registration</h1>

    <form id="registrationForm">

        <label for="name">Full Name</label>
        <input type="text" id="name" required>

        <label for="roll">Roll Number</label>
        <input type="text" id="roll" required>

        <label for="email">Email Address</label>
        <input type="email" id="email" required>

        <label for="phone">Phone Number</label>
        <input type="tel" id="phone" required>

        <label for="branch">Branch</label>
        <select id="branch" required>
            <option value="">Select Branch</option>
            <option>Computer Science</option>
            <option>Information Technology</option>
            <option>Electronics</option>
            <option>Mechanical</option>
            <option>Civil</option>
        </select>

        <label for="event">Event</label>
        <select id="event" required>
            <option value="">Select Event</option>
            <option>Hackathon</option>
            <option>Technical Quiz</option>
            <option>Web Development Workshop</option>
            <option>Coding Competition</option>
            <option>Sports Event</option>
        </select>

        <label for="comments">Comments</label>
        <textarea id="comments" rows="4"></textarea>

        <button type="submit">Register Now</button>

        <div id="message" class="success-message"></div>

    </form>

</div>

<script>
document.getElementById("registrationForm").addEventListener("submit", function(event){
    event.preventDefault();

    document.getElementById("message").innerHTML =
    "✅ Registration Successful!";
});
</script>

</body>
</html>
